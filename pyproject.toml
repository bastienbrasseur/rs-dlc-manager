[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-dlc-manager"
version = "0.1.0"
description = "Browse and toggle Rocksmith 2014 DLC songs without touching the .psarc files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bastien Brasseur" }]
dependencies = [
    "cryptography>=42",
    "PySide6>=6.6",
    "pyqtdarktheme>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[project.scripts]
rs-dlc-manager = "rsdlc.ui:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rsdlc"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/rsdlc", "tests"]

[[tool.mypy.overrides]]
module = ["qdarktheme", "qdarktheme.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
